
sensor_fault_injector:
  ros__parameters:
    sensor_names: ["lidar", "imu", "odometry"]

    lidar.raw_topic: "/scan_raw"
    lidar.public_topic: "/scan"
    lidar.msg_type: "sensor_msgs/msg/LaserScan"
    lidar.qos: "best_effort"

    imu.raw_topic: "/imu_raw"
    imu.public_topic: "/imu"
    imu.msg_type: "sensor_msgs/msg/Imu"
    imu.qos: "best_effort"

    odometry.raw_topic: "/odom_raw"
    odometry.public_topic: "/odom"
    odometry.msg_type: "nav_msgs/msg/Odometry"
    odometry.qos: "reliable"
